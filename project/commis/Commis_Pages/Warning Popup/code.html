<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Commis - Confirmation Warning Modal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Fonts: Plus Jakarta Sans, League Spartan, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=League+Spartan:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brandYellow: '#FFE600',
            darkBg: '#131313',
            cardBg: '#1c1b1b',
            cardSecondary: '#252424',
            borderSubtle: '#2e2d2d',
            textMuted: '#9CA3AF'
          },
          fontFamily: {
            spartan: ['"League Spartan"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif'],
            body: ['"Inter"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0b0b;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #app-container {
      width: 416px;
      height: 884px;
      max-width: 416px;
      max-height: 884px;
      position: relative;
      background-color: #131313;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 40px;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .pressable:active {
      transform: scale(0.97);
      transition: transform 0.1s ease;
    }
  </style>
</head>
<body>
  <!-- App Viewport (416px x 884px) -->
  <div id="app-container" class="relative text-white select-none">
    
    <!-- Background Dimmed Context: Commis Interface Preview -->
    <div class="absolute inset-0 flex flex-col pointer-events-none opacity-40 filter blur-[2px] transition-all">
      <!-- Mock Top Header -->
      <header class="px-5 pt-7 pb-3 flex items-center justify-between shrink-0 bg-[#131313] border-b border-[#222]">
        <div class="flex items-baseline font-spartan">
          <span class="text-[#FFE600] text-[30px] font-extrabold lowercase leading-none tracking-tight">commis</span>
          <span class="text-white text-[30px] font-black leading-none">.</span>
        </div>
        <div class="w-8 h-8 rounded-lg bg-neutral-800/80 flex items-center justify-center">
          <div class="w-4 h-0.5 bg-neutral-400 rounded-full mb-1"></div>
        </div>
      </header>
      
      <!-- Mock Content Body -->
      <div class="p-5 space-y-4">
        <div class="h-10 bg-neutral-800/50 rounded-xl"></div>
        <div class="h-28 bg-[#1c1b1b] rounded-2xl border border-neutral-800 p-4 space-y-2">
          <div class="h-4 w-3/4 bg-neutral-700/60 rounded"></div>
          <div class="h-3 w-1/2 bg-neutral-800 rounded"></div>
        </div>
        <div class="h-28 bg-[#1c1b1b] rounded-2xl border border-neutral-800 p-4 space-y-2">
          <div class="h-4 w-2/3 bg-neutral-700/60 rounded"></div>
          <div class="h-3 w-1/3 bg-neutral-800 rounded"></div>
        </div>
        <div class="h-32 bg-[#1c1b1b] rounded-2xl border border-neutral-800 p-4 space-y-2">
          <div class="h-4 w-4/5 bg-neutral-700/60 rounded"></div>
          <div class="h-3 w-2/5 bg-neutral-800 rounded"></div>
        </div>
      </div>
    </div>

    <!-- Modal Backdrop Overlay -->
    <div class="absolute inset-0 bg-black/75 backdrop-blur-sm z-30 flex items-center justify-center px-6" id="modal-backdrop">
      
      <!-- Warning Popup Dialog Card -->
      <div id="warning-modal" role="alertdialog" aria-modal="true" aria-labelledby="warning-modal-title" class="w-full max-w-[340px] bg-[#1a1919] border border-neutral-800/90 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center relative z-40 animate-in fade-in zoom-in-95 duration-150">
        <!-- Warning Icon Emblem -->
        

        <!-- Question Prompt (Verbatim Request) -->
        <h2 id="warning-modal-title" class="text-white text-[17px] font-semibold tracking-tight leading-snug px-1 mb-6">
          Are you sure to proceed with this action?
        </h2>

        <!-- Action Buttons (Yes | No) -->
        <div class="w-full flex items-center gap-3">
          <!-- No (Secondary / Cancel) -->
          <button type="button" onclick="handleAction('no')" class="flex-1 py-3 px-4 rounded-xl bg-neutral-800/80 hover:bg-neutral-800 active:bg-neutral-700 text-neutral-300 hover:text-white font-semibold text-sm transition-colors border border-neutral-700/60 pressable focus:outline-none">
            No
          </button>

          <!-- Yes (Primary / Confirm) -->
          <button type="button" onclick="handleAction('yes')" class="flex-1 py-3 px-4 rounded-xl bg-[#FFE600] hover:bg-[#ebd400] active:bg-[#d8c300] text-black font-bold text-sm transition-all shadow-[0_3px_12px_rgba(255,230,0,0.22)] pressable focus:outline-none">
            Yes
          </button>
        </div>

        <!-- Status Toast / Feedback (Hidden by default, shows on click) -->
        <div id="action-toast" class="hidden mt-4 text-xs font-medium text-neutral-400 py-1 px-3 bg-neutral-900/80 border border-neutral-800 rounded-full transition-all">
          <span id="action-toast-text"></span>
        </div>
      </div>

    </div>

  </div>

  <script>
    function handleAction(choice) {
      const toast = document.getElementById('action-toast');
      const toastText = document.getElementById('action-toast-text');
      
      if (toast && toastText) {
        toast.classList.remove('hidden');
        if (choice === 'yes') {
          toastText.textContent = 'Proceeding with action...';
          toastText.className = 'text-[#FFE600]';
        } else {
          toastText.textContent = 'Action canceled';
          toastText.className = 'text-neutral-400';
        }
      }
    }
  </script>




</body></html>
