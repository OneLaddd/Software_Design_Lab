full px-margin pt-space-sm pb-space-xs flex items-center justify-between"></div></div><main class="flex flex-col relative w-full overflow-y-auto px-margin pb-space-lg bg-surface-container"><div class="flex flex-col w-full space-y-space-md pb-space-md">
<!-- Request Context Card -->
<div class="flex flex-col bg-surface-container-high rounded-xl p-space-md shadow-md">
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-semibold">Request</span>
<span class="inline-flex items-center px-space-xs py-0.5 rounded-full bg-surface-container-highest text-secondary font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[12px] mr-1 text-primary-fixed" style="font-variation-settings: 'FILL' 1;">analytics</span>
        Avg. Bid $111 USD
      </span>
</div>
<div class="mt-space-xs flex items-start gap-space-sm">
<div class="flex-1 min-w-0">
<h2 class="font-headline-sm text-headline-sm text-tertiary truncate">A4 Novel Typesetting Project</h2>
<div class="flex items-center gap-space-xs mt-1">
<span class="font-body-sm text-body-sm text-on-surface-variant">Bounty Budget:</span>
<span class="font-label-md text-label-md text-primary-fixed font-bold">$30 – $250 USD</span>
</div>
</div>
<div class="w-10 h-10 rounded-lg bg-surface-container-low flex items-center justify-center flex-shrink-0 text-primary-fixed">

</div>
</div>
</div>
<!-- Bid Amount Section -->
<div class="flex flex-col space-y-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider flex items-center gap-1 font-semibold">
<span class="">Bid Amount</span>
<span class="text-primary-fixed">*</span>
</label>
<span class="font-label-sm text-label-sm text-secondary font-medium">USD Currency</span>
</div>
<!-- Interactive Numeric Card Input -->
<div class="relative flex items-center bg-surface-container-low rounded-xl px-space-md py-space-sm shadow-sm transition-all focus-within:shadow-[0_0_16px_rgba(253,228,0,0.18)]">
<div class="flex items-center pr-space-sm text-primary-fixed">
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold">$</span>
</div>
<input class="w-full bg-transparent font-headline-lg-mobile text-headline-lg-mobile text-tertiary font-bold focus:outline-none placeholder:text-surface-container-highest" id="bid-input" inputmode="numeric" max="250" min="30" placeholder="0" type="number" value="105">
<div class="flex items-center gap-space-xs flex-shrink-0">
<button class="w-8 h-8 rounded-lg bg-surface-container-high active:bg-surface-container-highest text-on-surface flex items-center justify-center transition-colors" onclick="adjustBid(-5)" type="button">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<button class="w-8 h-8 rounded-lg bg-surface-container-high active:bg-surface-container-highest text-on-surface flex items-center justify-center transition-colors" onclick="adjustBid(5)" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
<!-- Real-time Status / Helper Text -->
<div class="flex items-center justify-between px-space-xs pt-1">
<div class="flex items-center gap-1.5 text-primary-fixed-dim">

</div>

<textarea class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 resize-none focus:outline-none" id="proposal-msg" maxlength="500" oninput="updateCount(this)" placeholder="Explain how you can complete this request..." rows="4">I can professionally format the entire manuscript in InDesign with custom chapter headers, print margins, and full ePub export ready for A4 printing.</textarea>
<!-- Visual Hunter Guidance Footer inside card -->
<div class="flex items-center justify-between pt-space-xs mt-space-xs bg-surface-container-low">

<div class="flex flex-col gap-space-sm pt-space-sm">

<button class="w-full h-11 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-lg text-label-lg flex items-center justify-center transition-colors" onclick="history.back()" type="button">
      Cancel
    </button>
</div>
</div>
<script>
  function adjustBid(delta) {
    const input = document.getElementById('bid-input');
    if (!input) return;
    let currentVal = parseInt(input.value, 10) || 0;
    let newVal = Math.max(30, Math.min(250, currentVal + delta));
    input.value = newVal;
    updateSubmitText(newVal);
  }

  function updateSubmitText(val) {
    const submitBtn = document.querySelector('button[onclick="handleSubmitBid()"] span:last-child');
    if (submitBtn) {
      submitBtn.textContent = 'Submit Bid • $' + val + ' USD';
    }
  }

  const bidInputEl = document.getElementById('bid-input');
  if (bidInputEl) {
    bidInputEl.addEventListener('input', (e) => {
      let val = parseInt(e.target.value, 10);
      if (!isNaN(val)) {
        updateSubmitText(val);
      }
    });
  }

  function updateCount(textarea) {
    const counter = document.getElementById('char-counter');
    if (counter) {
      counter.textContent = `${textarea.value.length} / 500`;
    }
  }

  function handleSubmitBid() {
    const input = document.getElementById('bid-input');
    const amount = input ? input.value : '105';
    const btn = document.querySelector('button[onclick="handleSubmitBid()"]');
    if (btn) {
      btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Submitting...</span>`;
      btn.disabled = true;
      setTimeout(() => {
        btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check</span><span>Bid Placed!</span>`;
        setTimeout(() => {
          if (window.history) window.history.back();
        }, 600);
      }, 700);
    }
  }
</script></main></div>
