          Title

<span class="font-label-sm text-label-sm text-on-surface-variant" id="title-counter">154 / 300</span>
</div>
<div class="relative bg-surface-container-high rounded-xl p-3 shadow-inner focus-within:bg-surface-container-highest transition-colors">
<textarea class="w-full bg-transparent font-headline-sm text-headline-sm text-tertiary placeholder-on-surface-variant focus:outline-none resize-none leading-snug" id="post-title" maxlength="300" rows="3" placeholder="I am one of the developers of OpenAI that helped solve Navier–Stokes Millennium Prize Problem, one of the deepest problems at the frontier of mathematics.">I am one of the developers of OpenAI that helped solve Navier–Stokes Millennium Prize Problem, one of the deepest problems at the frontier of mathematics.</textarea>
</div>
</div>
<!-- Post Content Field -->
<div class="flex flex-col">
<div class="flex items-center justify-between mb-2">
<label class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant" for="post-body">
          Content
        </label>

</div>
<div class="bg-surface-container-high rounded-xl overflow-hidden shadow-inner focus-within:bg-surface-container-highest transition-colors">
<textarea class="w-full bg-transparent p-3.5 font-body-md text-body-md text-tertiary placeholder-on-surface-variant focus:outline-none resize-none leading-relaxed" id="post-body" rows="7">We combined sparse neural operators with distributed physics-informed transformers over 12,000 H100 clusters to prove global regularity across smooth bounded domains.

In this post, we break down how boundary condition discretization interacts with vorticity damping, and why traditional PDE solvers hit dimensional bottlenecks. Full theorem derivations and open-source benchmark reproduction scripts are linked below.</textarea>
<!-- Markdown Quick Tool Bar -->
<div class="bg-surface-container-lowest/80 px-2 py-1.5 flex items-center justify-between">
<div class="flex items-center space-x-1">
<button class="w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-primary-container hover:bg-surface-container transition-colors" title="Bold" type="button">
<span class="font-headline-sm text-headline-sm font-bold leading-none">B</span>
</button>
<button class="w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-primary-container hover:bg-surface-container transition-colors" title="Italic" type="button">
<span class="font-headline-sm text-headline-sm italic leading-none font-serif">I</span>
</button>
<button class="w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-primary-container hover:bg-surface-container transition-colors" title="Insert Link" type="button">
<span class="material-symbols-outlined text-[18px]">link</span>
</button>

<button class="w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-primary-container hover:bg-surface-container transition-colors" title="Bullet List" type="button">
<span class="material-symbols-outlined text-[18px]">format_list_bulleted</span>
</button>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant pr-2">294 words</span>
</div>
</div>
</div>
<!-- Media Attachment Management -->
<div class="flex flex-col">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center space-x-2">
<label class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant">
            Attached Media
          </label>
<span class="bg-surface-container-highest text-tertiary px-2 py-0.5 rounded-full font-label-sm text-label-sm" id="media-count-badge">1</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Max 4 files</span>
</div>
<!-- Attachment Preview Card -->
<div class="bg-surface-container-low rounded-xl p-3 flex items-center justify-between shadow-sm" id="media-card">
<div class="flex items-center space-x-3 min-w-0">
<div class="w-14 h-14 rounded-lg bg-surface-container-lowest overflow-hidden shrink-0 relative">
<img class="w-full h-full object-cover" data-alt="High contrast vibrant fluid dynamic particle ribbons swirling in turbulent chaos, electric neon yellow and turquoise filaments against a pitch black cosmic background, mathematically precise simulation visualization" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCGopawVyZDAZwnG_Ziji79MS3YEaaWbVGYslRvj8y9RLPo1kimwiS6MTCRLiWM6WUTMdrhhBNC8c8gaHgLXTjACi08CsKQRETrEeWZcF36JiDvCzzXcO5Pd5nH2biNa0w3AcpRLnhsw2RD-TBDS38sk60VHT640tpQHYK5bcAmBMv4XqydphucVkMsbuh2qUW3_20k22XxyaahaW9nPfkxvg1-Q-IW6dzMpX1YDe1MkAMm6fA8dxmLGQ">
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-tertiary font-medium truncate">Vector_simulation_vtp.png</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">1.4 MB • High Res Plot</span>
</div>
</div>
<button class="px-2.5 py-1.5 rounded-lg bg-surface-container hover:bg-error-container/40 text-on-surface-variant hover:text-error transition-colors flex items-center space-x-1 shrink-0 ml-2" id="btn-remove-media" type="button">
<span class="material-symbols-outlined text-[16px]">delete</span>
<span class="font-label-sm text-label-sm">Remove</span>
</button>
</div>
<!-- Add Media Button -->
<button class="mt-2.5 w-full py-3 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface flex items-center justify-center space-x-2 transition-colors" id="btn-add-media" type="button">
<span class="material-symbols-outlined text-[20px] text-primary-container">add_photo_alternate</span>
<span class="font-label-lg text-label-lg font-semibold text-tertiary">+ Add Media</span>
</button>
</div>
<!-- Version History Notice Banner -->

<!-- Action Buttons -->
<div class="flex flex-col gap-2.5 pt-2">
<button class="w-full py-3.5 rounded-full bg-primary-container text-on-primary-fixed font-headline-sm text-headline-sm font-bold flex items-center justify-center space-x-2 shadow-lg hover:brightness-105 active:scale-[0.99] transition-all" id="btn-save-changes" type="button">
<span class="material-symbols-outlined text-[20px]">check</span>
<span class="">Save Changes</span>
</button>
<button class="w-full py-3 rounded-full bg-surface-container-low hover:bg-surface-container text-tertiary font-label-lg text-label-lg transition-colors flex items-center justify-center" id="btn-cancel" type="button">
        Cancel
      </button>
</div>
</div>
<!-- Discard Confirmation Modal / Backdrop -->
<div class="fixed inset-0 z-50 bg-surface-dim/80 backdrop-blur-sm flex items-end justify-center px-4 pb-6 transition-opacity opacity-0 pointer-events-none duration-200" id="discard-modal">
<div class="w-full max-w-sm bg-surface-container-high rounded-2xl p-5 shadow-2xl flex flex-col space-y-4">
<div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center">
<span class="material-symbols-outlined text-error text-[22px]">warning</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md font-bold text-tertiary">Discard Changes?</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 leading-relaxed">
          Your changes haven't been saved. Are you sure you want to leave? Any unsaved edits will be permanently lost.
        </p>
</div>
<div class="flex flex-col gap-2 pt-2">
<button class="w-full py-3 rounded-xl bg-error-container hover:bg-on-error text-error hover:text-tertiary font-label-lg text-label-lg font-bold transition-colors" id="btn-confirm-discard" type="button">
          Discard Edits
        </button>
<button class="w-full py-3 rounded-xl bg-surface-container-highest text-tertiary font-label-lg text-label-lg font-semibold hover:bg-surface-bright transition-colors" id="btn-dismiss-modal" type="button">
          Keep Editing
        </button>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const titleInput = document.getElementById('post-title');
    const titleCounter = document.getElementById('title-counter');
    const saveBtn = document.getElementById('btn-save-changes');
    const cancelBtn = document.getElementById('btn-cancel');
    const discardModal = document.getElementById('discard-modal');
    const dismissModalBtn = document.getElementById('btn-dismiss-modal');
    const confirmDiscardBtn = document.getElementById('btn-confirm-discard');
    const removeMediaBtn = document.getElementById('btn-remove-media');
    const mediaCard = document.getElementById('media-card');
    const mediaCountBadge = document.getElementById('media-count-badge');
    const addMediaBtn = document.getElementById('btn-add-media');

    // Title counter sync
    if (titleInput && titleCounter) {
      titleInput.addEventListener('input', (e) => {
        const len = e.target.value.length;
        titleCounter.textContent = `${len} / 300`;
      });
    }

    // Modal helpers
    function openModal() {
      discardModal.classList.remove('opacity-0', 'pointer-events-none');
      discardModal.classList.add('opacity-100', 'pointer-events-auto');
    }

    function closeModal() {
      discardModal.classList.add('opacity-0', 'pointer-events-none');
      discardModal.classList.remove('opacity-100', 'pointer-events-auto');
    }

    if (cancelBtn) {
      cancelBtn.addEventListener('click', openModal);
    }

    if (dismissModalBtn) {
      dismissModalBtn.addEventListener('click', closeModal);
    }

    if (confirmDiscardBtn) {
      confirmDiscardBtn.addEventListener('click', () => {
        history.back();
      });
    }

    // Media removal interaction
    if (removeMediaBtn && mediaCard && mediaCountBadge) {
      removeMediaBtn.addEventListener('click', () => {
        mediaCard.classList.add('hidden');
        mediaCountBadge.textContent = '0';
      });
    }

    if (addMediaBtn && mediaCard && mediaCountBadge) {
      addMediaBtn.addEventListener('click', () => {
        mediaCard.classList.remove('hidden');
        mediaCountBadge.textContent = '1';
      });
    }

    // Save mock trigger
    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>Saving...</span>';
        setTimeout(() => {
          saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check</span><span>Saved!</span>';
          setTimeout(() => history.back(), 500);
        }, 600);
      });
    }
  })();
</script></main>
