<!DOCTYPE html><html class="dark" lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-error": "#690005", "on-tertiary-fixed-variant": "#454747", "on-primary-fixed-variant": "#504700", "surface-container-lowest": "#0e0e0e", "on-primary-container": "#716500", "on-secondary-fixed-variant": "#474649", "surface-dim": "#131313", "inverse-surface": "#e5e2e1", "inverse-primary": "#6a5f00", "secondary-fixed-dim": "#c8c6c8", "on-secondary-fixed": "#1b1b1d", "error-container": "#93000a", "secondary-container": "#474649", "inverse-on-surface": "#313030", "surface-container-low": "#1c1b1b", "on-primary": "#373100", "on-secondary": "#303032", "tertiary-fixed": "#e2e2e2", "on-secondary-container": "#b6b4b7", "tertiary-fixed-dim": "#c8c6c9", "surface-variant": "#353534", "secondary": "#c8c6c8", "surface-container-highest": "#353534", "surface-container": "#201f1f", "surface-tint": "#dec800", "on-tertiary-container": "#636465", "secondary-fixed": "#e4e2e4", "primary-fixed-dim": "#dec800", "tertiary-container": "#e2e2e2", "on-surface": "#e5e2e1", "primary-container": "#fde400", "outline-variant": "#4b4731", "on-primary-fixed": "#201c00", "surface-bright": "#393939", "surface-container-high": "#2a2a2a", "error": "#ffb4ab", "on-error-container": "#ffdad6", "surface": "#131313", "on-tertiary-fixed": "#1b1b1e", "on-surface-variant": "#cdc7aa", "on-background": "#e5e2e1", "outline": "#979177", "primary": "#ffffff", "tertiary": "#ffffff", "on-tertiary": "#303033", "background": "#131313", "primary-fixed": "#fde400" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "1rem", "margin": "1.25rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "space-md": "1rem", "space-lg": "1.5rem", "space-xl": "2rem" }, "fontFamily": { "body-md": ["Inter"], "label-lg": ["Inter"], "headline-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-sm": ["Inter"], "headline-lg-mobile": ["Plus Jakarta Sans"], "body-sm": ["Inter"], "body-lg": ["Inter"], "display": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "label-md": ["Inter"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "700" }], "headline-lg-mobile": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "800" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface text-on-surface antialiased flex flex-col justify-end min-h-screen relative overflow-x-hidden"><div class="fixed inset-0 bg-surface-container-lowest/80 backdrop-blur-sm z-10 transition-opacity" onclick="if(window.history.length&gt;1){history.back();}else{console.log('dismiss');}"></div><main class="relative z-20 w-full flex flex-col bg-surface-container-low rounded-t-xl max-h-[92vh] overflow-y-auto pb-safe shadow-[0_-8px_32px_rgba(0,0,0,0.6)]"><div class="w-full flex items-center justify-center pt-space-md pb-space-xs"><div class="w-10 h-1 rounded-full bg-outline-variant/60"></div></div><div class="flex items-center justify-between px-margin py-space-sm"><h2 class="font-headline-sm text-headline-sm text-on-surface">Quick Action Sheet</h2><button class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors" onclick="if(window.history.length&gt;1){history.back();}else{console.log('close');}" type="button"><span class="material-symbols-outlined text-[20px]">close</span></button></div><div class="flex flex-col px-margin pb-space-lg pt-space-xs"><div class="flex flex-col w-full space-y-space-md">
<!-- Request Info Context Card -->
<div class="flex flex-col bg-surface-container rounded-xl p-space-md shadow-sm space-y-space-xs">
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Request</span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface text-label-sm">
<span class="material-symbols-outlined text-[13px] text-primary-fixed mr-1" style="font-variation-settings: 'FILL' 1;">insights</span>
        Avg. Bid $111 USD
      </span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface">A4 Novel Typesetting Project</h3>
<div class="flex items-center pt-space-xs text-body-sm font-body-sm text-on-surface-variant">
<span class="">Bounty Budget:</span>
<span class="ml-1.5 font-label-md text-label-md text-primary-fixed bg-surface-container-highest px-1.5 py-0.5 rounded">$30 – $250 USD</span>
</div>
</div>
<!-- Bid Amount Section -->
<div class="flex flex-col space-y-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="bid-amount-input">
        BID AMOUNT <span class="text-primary-fixed">*</span>
</label>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide">USD Currency</span>
</div>
<!-- Stepper & Input Container -->
<div class="flex items-center bg-surface-container rounded-xl p-space-xs shadow-sm">
<button aria-label="Decrease bid by 5 dollars" class="w-12 h-12 flex items-center justify-center rounded-lg bg-surface-container-high text-on-surface hover:bg-surface-bright active:scale-95 transition-all" id="btn-decrement" type="button">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
<div class="flex-1 flex items-center justify-center px-space-sm">
<span class="font-headline-md text-headline-md text-primary-fixed mr-1">$</span>
<input class="w-24 bg-transparent font-headline-md text-headline-md text-on-surface text-center outline-none focus:text-primary-fixed transition-colors [appearance:textfield] [&amp;::-webkit-outer-spin-button]:appearance-none [&amp;::-webkit-inner-spin-button]:appearance-none" id="bid-amount-input" max="9999" min="1" step="1" type="number" value="105">
</div>
<button aria-label="Increase bid by 5 dollars" class="w-12 h-12 flex items-center justify-center rounded-lg bg-surface-container-high text-on-surface hover:bg-surface-bright active:scale-95 transition-all" id="btn-increment" type="button">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
<!-- Validation / Feedback status banner -->
<div class="flex items-center px-1 text-body-sm font-body-sm text-primary-fixed transition-colors" id="budget-status">
<span class="material-symbols-outlined text-[16px] mr-1.5" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span id="budget-status-text" class="">Within client budget range ($30 – $250 USD)</span>
</div>
</div>
<!-- Message Section -->
<div class="flex flex-col space-y-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="bid-message">
        MESSAGE
      </label>
<span class="font-label-sm text-label-sm text-on-surface-variant font-mono" id="char-counter">128 / 500</span>
</div>
<div class="relative w-full">
<textarea class="w-full bg-surface-container text-on-surface font-body-md text-body-md rounded-xl p-space-md placeholder:text-on-surface-variant outline-none focus:bg-surface-container-high transition-all resize-none shadow-sm" id="bid-message" maxlength="500" rows="4">I can professionally format the entire manuscript and make sure the final document is properly prepared for A4 printing.</textarea>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant px-1">
      Update your approach, toolchain, or relevant details for the client.
    </p>
</div>
<!-- Actions Section -->
<div class="flex flex-col space-y-space-sm pt-space-xs">
<button class="w-full flex items-center justify-center py-3.5 px-space-md rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg shadow-md hover:bg-primary-fixed-dim active:scale-[0.99] transition-all" id="save-bid-btn" type="button">
<span class="material-symbols-outlined text-[20px] mr-2" style="font-variation-settings: 'FILL' 1;">save</span>
      Save Changes
    </button><button class="w-full flex items-center justify-center py-3 px-space-md rounded-xl hover:bg-surface-container-high font-label-lg text-label-lg active:scale-[0.99] transition-all bg-transparent text-on-surface-variant hover:text-on-surface" id="withdraw-bid-btn" type="button" onclick="if(confirm('Are you sure you want to withdraw your bid?')){if(window.history.length&gt;1){history.back();}else{console.log('bid-withdrawn');}}">
<span class="material-symbols-outlined text-[20px] mr-2">delete_outline</span>
      Withdraw Bid
    </button>
<button class="w-full flex items-center justify-center py-3 px-space-md rounded-xl bg-surface-container-high text-on-surface font-label-lg text-label-lg hover:bg-surface-bright active:scale-[0.99] transition-all" onclick="if(window.history.length&gt;1){history.back();}else{console.log('cancel');}" type="button">
      Cancel
    </button>
</div>
</div>
<script>
  (function() {
    const input = document.getElementById('bid-amount-input');
    const decBtn = document.getElementById('btn-decrement');
    const incBtn = document.getElementById('btn-increment');
    const statusWrap = document.getElementById('budget-status');
    const statusText = document.getElementById('budget-status-text');
    const msg = document.getElementById('bid-message');
    const charCounter = document.getElementById('char-counter');
    const saveBtn = document.getElementById('save-bid-btn');

    const minBudget = 30;
    const maxBudget = 250;

    function checkBudget() {
      const val = parseInt(input.value, 10);
      if (isNaN(val)) {
        statusWrap.className = 'flex items-center px-1 text-body-sm font-body-sm text-error transition-colors';
        statusWrap.firstElementChild.textContent = 'error';
        statusText.textContent = 'Please enter a valid bid amount';
        return;
      }

      if (val >= minBudget && val <= maxBudget) {
        statusWrap.className = 'flex items-center px-1 text-body-sm font-body-sm text-primary-fixed transition-colors';
        statusWrap.firstElementChild.textContent = 'check_circle';
        statusText.innerHTML = 'Within client budget range ($30 &ndash; $250 USD)';
      } else if (val < minBudget) {
        statusWrap.className = 'flex items-center px-1 text-body-sm font-body-sm text-on-surface-variant transition-colors';
        statusWrap.firstElementChild.textContent = 'info';
        statusText.innerHTML = 'Below client minimum range ($30 USD)';
      } else {
        statusWrap.className = 'flex items-center px-1 text-body-sm font-body-sm text-secondary transition-colors';
        statusWrap.firstElementChild.textContent = 'info';
        statusText.innerHTML = 'Exceeds target budget of $250 USD';
      }
    }

    if (decBtn && input) {
      decBtn.addEventListener('click', function() {
        let current = parseInt(input.value, 10) || minBudget;
        if (current > 5) {
          input.value = current - 5;
          checkBudget();
        }
      });
    }

    if (incBtn && input) {
      incBtn.addEventListener('click', function() {
        let current = parseInt(input.value, 10) || 0;
        input.value = current + 5;
        checkBudget();
      });
    }

    if (input) {
      input.addEventListener('input', checkBudget);
    }

    if (msg && charCounter) {
      msg.addEventListener('input', function() {
        charCounter.textContent = `${msg.value.length} / 500`;
      });
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] mr-2 animate-spin">progress_activity</span> Updating...';
        saveBtn.disabled = true;
        setTimeout(function() {
          saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] mr-2">check</span> Bid Updated!';
          setTimeout(function() {
            if (window.history.length > 1) {
              window.history.back();
            }
          }, 400);
        }, 600);
      });
    }
  })();
</script></div></main>

</body></html>
