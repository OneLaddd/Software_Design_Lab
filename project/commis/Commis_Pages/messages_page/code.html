<!-- BEGIN: Tab Switching Script -->
<script>
  function switchTab(target) {
    const isNotifs = target === 'notifications';

    const panelNotifs = document.getElementById('panel-notifications');
    const panelChats = document.getElementById('panel-chats');

    const tabNotifs = document.getElementById('tab-notifications');
    const tabChats = document.getElementById('tab-chats');

    const indNotifs = document.getElementById('indicator-notifications');
    const indChats = document.getElementById('indicator-chats');

    if (isNotifs) {
      panelNotifs.classList.remove('hidden');
      panelNotifs.classList.add('flex');
      panelChats.classList.add('hidden');
      panelChats.classList.remove('flex');

      tabNotifs.setAttribute('aria-selected', 'true');
      tabNotifs.classList.remove('text-neutral-400');
      tabNotifs.classList.add('text-white', 'font-semibold');

      tabChats.setAttribute('aria-selected', 'false');
      tabChats.classList.remove('text-white', 'font-semibold');
      tabChats.classList.add('text-neutral-400', 'font-medium');

      indNotifs.classList.remove('opacity-0', 'scale-x-50');
      indNotifs.classList.add('opacity-100', 'scale-x-100');

      indChats.classList.remove('opacity-100', 'scale-x-100');
      indChats.classList.add('opacity-0', 'scale-x-50');
    } else {
      panelChats.classList.remove('hidden');
      panelChats.classList.add('flex');
      panelNotifs.classList.add('hidden');
      panelNotifs.classList.remove('flex');

      tabChats.setAttribute('aria-selected', 'true');
      tabChats.classList.remove('text-neutral-400');
      tabChats.classList.add('text-white', 'font-semibold');

      tabNotifs.setAttribute('aria-selected', 'false');
      tabNotifs.classList.remove('text-white', 'font-semibold');
      tabNotifs.classList.add('text-neutral-400', 'font-medium');

      indChats.classList.remove('opacity-0', 'scale-x-50');
      indChats.classList.add('opacity-100', 'scale-x-100');

      indNotifs.classList.remove('opacity-100', 'scale-x-100');
      indNotifs.classList.add('opacity-0', 'scale-x-50');
    }
  }
</script>
<!-- END: Tab Switching Script -->
